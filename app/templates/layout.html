<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Polarr{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/tailwind.min.css">
    <script src="https://cdn.jsdelivr.net/npm/instant.page@5.2.0/instantpage.js" type="module"></script>
    <style>
        /* Toast animations */
        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            min-width: 18rem;
            max-width: 24rem;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            background-color: #18181b;
            border: 1px solid #27272a;
            color: #f4f4f5;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast.hide {
            transform: translateX(120%);
            opacity: 0;
        }
        .toast-success { border-left: 4px solid #10b981; }
        .toast-error   { border-left: 4px solid #f43f5e; }
        .toast-info    { border-left: 4px solid #06b6d4; }

        /* Search dropdown */
        .search-dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            right: 0;
            background: #18181b;
            border-radius: 0.75rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #27272a;
            max-height: 24rem;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }
        .search-dropdown.active { display: block; }
    </style>
</head>

    <!-- JavaScript Handlers -->
    <script>
        // ── Toast Notifications ──
        function showToast(message, level = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${level}`;

            const iconMap = {
                success: `<svg class="w-5 h-5 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
                error: `<svg class="w-5 h-5 text-rose-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
                info: `<svg class="w-5 h-5 text-cyan-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`
            };

            toast.innerHTML = `
                ${iconMap[level] || iconMap.info}
                <div class="flex-1 text-sm text-zinc-200 leading-tight">${message}</div>
                <button type="button" class="text-zinc-500 hover:text-zinc-300 ml-2" onclick="this.parentElement.classList.replace('show','hide');setTimeout(()=>this.parentElement.remove(),300)">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            `;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => toast.classList.add('show'));
            });

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.classList.replace('show', 'hide');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4500);
        }

        // Check query string for flash toasts
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const msg = params.get('_toast');
            const lvl = params.get('_toast_level') || 'success';
            if (msg) {
                showToast(decodeURIComponent(msg), lvl);
                // Clean URL
                params.delete('_toast');
                params.delete('_toast_level');
                const newQuery = params.toString();
                const newUrl = window.location.pathname + (newQuery ? '?' + newQuery : '') + window.location.hash;
                window.history.replaceState({}, '', newUrl);
            }
        });

        // ── Mobile Navigation Drawer ──
        function toggleMobileMenu() {
            const drawer = document.getElementById('mobile-menu-drawer');
            drawer.classList.toggle('hidden');
        }

        // ── Confirmation Modal System ──
        let modalConfirmCallback = null;
        function openConfirmModal(title, message, confirmBtnText, onConfirm, isDanger = true) {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-modal-box');
            const titleEl = document.getElementById('confirm-modal-title');
            const msgEl = document.getElementById('confirm-modal-message');
            const btn = document.getElementById('confirm-modal-confirm-btn');

            titleEl.textContent = title;
            msgEl.textContent = message;
            btn.textContent = confirmBtnText;

            if (isDanger) {
                btn.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-500 text-white transition-colors shadow-lg shadow-rose-600/20";
            } else {
                btn.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-cyan-600 hover:bg-cyan-500 text-zinc-950 transition-colors shadow-lg shadow-cyan-600/20";
            }

            modalConfirmCallback = onConfirm;
            btn.onclick = () => {
                if (modalConfirmCallback) modalConfirmCallback();
                closeConfirmModal();
            };

            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-modal-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 150);
            modalConfirmCallback = null;
        }

        // ── Live Global Search ──
        const searchInput = document.getElementById('search-input');
        const searchDropdown = document.getElementById('search-dropdown');
        let searchTimeout = null;

        if (searchInput) {
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput && !['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });

            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                const q = searchInput.value.trim();
                if (q.length < 1) {
                    searchDropdown.classList.remove('active');
                    return;
                }
                searchTimeout = setTimeout(() => {
                    fetch(`/api/search?q=${encodeURIComponent(q)}`)
                        .then(r => r.json())
                        .then(data => {
                            if (!data.podcasts.length && !data.episodes.length) {
                                searchDropdown.innerHTML = `<div class="p-4 text-center text-xs text-zinc-500">No matching podcasts or episodes found</div>`;
                                searchDropdown.classList.add('active');
                                return;
                            }
                            let html = '';
                            if (data.podcasts.length) {
                                html += `<div class="px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-zinc-500 bg-zinc-900/90 border-b border-zinc-800">Podcasts</div>`;
                                data.podcasts.forEach(p => {
                                    html += `
                                        <a href="/podcast/${p.id}" class="flex items-center justify-between px-3.5 py-2.5 text-sm hover:bg-zinc-800/60 border-b border-zinc-800/40 transition-colors">
                                            <span class="font-medium text-zinc-200">${p.title}</span>
                                            <span class="text-[11px] px-2 py-0.5 rounded ${p.subscribed ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/50' : 'bg-zinc-800 text-zinc-400'}">${p.subscribed ? 'Active' : 'Archived'}</span>
                                        </a>
                                    `;
                                });
                            }
                            if (data.episodes.length) {
                                html += `<div class="px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-zinc-500 bg-zinc-900/90 border-b border-zinc-800">Episodes</div>`;
                                data.episodes.forEach(e => {
                                    html += `
                                        <a href="/podcast/${e.podcast_id}" class="block px-3.5 py-2.5 hover:bg-zinc-800/60 border-b border-zinc-800/40 transition-colors">
                                            <div class="text-sm font-medium text-zinc-200">${e.episode_title}</div>
                                            <div class="text-xs text-zinc-500 mt-0.5">${e.podcast_title} · ${e.played_at || ''}</div>
                                        </a>
                                    `;
                                });
                            }
                            searchDropdown.innerHTML = html;
                            searchDropdown.classList.add('active');
                        });
                }, 200);
            });

            document.addEventListener('click', (e) => {
                if (!document.getElementById('search-wrapper').contains(e.target)) {
                    searchDropdown.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
